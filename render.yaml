services:
  - type: web
    name: sharpener-fights-realtime
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=@sharpener/realtime
    healthCheckPath: /__healthcheck
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: BUILD_ID
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ALLOWED_WEB_ORIGINS
        sync: false
